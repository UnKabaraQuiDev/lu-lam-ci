name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PAGES_HOST }}
          username: ${{ secrets.PAGES_USERNAME }}
          key: ${{ secrets.PAGES_SSH_KEY }}
          port: ${{ secrets.PAGES_PORT }}
          script: |
            set -e

            mkdir -p /var/www
            cd /var/www

            LOC="${{ vars.PAGES_LOCATION }}"
            git config --global --add safe.directory $LOC

            if [ ! -d "$LOC/.git" ]; then
              rm -rf $LOC/*
              git clone \
                --branch pages \
                https://${{ secrets.GH_PAT }}@github.com/UnKabaraQuiDev/UnKabaraQuiDev.git \
                $LOC
            fi

            cd $LOC

            git fetch origin pages
            git checkout pages
            git reset --hard origin/pages