name: Fill Exam Templates

on:
  push:
    branches:
      - pages

  workflow_dispatch:

env:
  EXAM_TEMPLATES: "all"

jobs:
  fill:
    name: Fill exam-db template
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fill exam-db template
        run: |
          for name in $EXAM_TEMPLATES; do
            echo "Running fill-exam-${name}.py"
            python ".github/scripts/fill-exam-${name}.py"
          done

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit & Push changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: Fill template for exam-db"
            git push origin HEAD:main
          fi