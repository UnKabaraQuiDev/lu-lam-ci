<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title">Exam Tools</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/css.js"></script>
    <script src="/js/i18n.js"></script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-900">

    <!-- Header -->
    <header class="bg-white border-b">
        <div class="max-w-6xl mx-auto px-6 py-5">
            <h1 class="text-2xl font-bold" data-i18n="title">
                Exam Tools
            </h1>

            <p class="text-gray-500 mt-1" data-i18n="subtitle">
                Everything you need to prepare for your exams.
            </p>
        </div>
        <select
            onchange="setLanguage(this.value)"
            class="border rounded-lg px-3 py-2"
        >
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
        </select>
    </header>

    <!-- Main -->
    <main class="max-w-6xl mx-auto px-6 py-10 space-y-6">

        {{TABLE}}

    </main>

</body>

</html>
